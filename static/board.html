<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Store Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/board.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐶</text></svg>"
    />
  </head>
  <body>
    <div id="stage">
      <div class="bg-orbs" aria-hidden="true"></div>
      <div class="frame" aria-hidden="true">
        <span class="paw tl">🐾</span><span class="paw tr">🐾</span>
        <span class="paw bl">🐾</span><span class="paw br">🐾</span>
      </div>

      <header class="topbar">
        <div class="brand">
          <div class="logo">🐾</div>
          <div class="brand-text">
            <div id="store-name" class="store-name">Sugar Sweet Georgia Puppies</div>
            <div class="store-sub">Store Dashboard</div>
          </div>
        </div>

        <div class="counters">
          <div class="counter" id="c-awaiting">
            <div class="counter-top"><span class="dot"></span><span class="counter-num" id="count-awaiting">0</span></div>
            <span class="counter-lbl">Awaiting Call</span>
          </div>
          <div class="counter" id="c-appts">
            <div class="counter-top"><span class="dot"></span><span class="counter-num" id="count-appts">0</span></div>
            <span class="counter-lbl">Appts Today</span>
          </div>
          <div class="counter" id="c-total">
            <div class="counter-top"><span class="dot"></span><span class="counter-num" id="count-total">0</span></div>
            <span class="counter-lbl">Inquiries Today</span>
          </div>
        </div>

        <div class="clockbox">
          <span id="clock" class="clock">--:--</span>
          <button id="chime-toggle" class="sound-btn" type="button"
                  aria-pressed="false" title="Sound: new inquiries + red alerts">
            <span class="chime-ic">🔇</span>
          </button>
        </div>
      </header>

      <main class="board">
        <section class="panel panel-leads">
          <h2 class="panel-title">
            <span class="pt-ic">💬</span>
            <span class="pt-name">New Inquiries</span>
            <span class="panel-count" id="panel-leads-count">0</span>
          </h2>
          <div class="cards" id="leads"></div>
        </section>

        <section class="panel panel-appts">
          <h2 class="panel-title">
            <span class="pt-ic">📅</span>
            <span class="pt-name">Appointments</span>
            <span class="panel-count" id="panel-appts-count">0</span>
            <span class="pt-aside" id="appts-tomorrow" hidden>Tomorrow <b>0</b></span>
          </h2>
          <div class="cards" id="appts"></div>
        </section>
      </main>

      <!-- Back of the house: floor, side posts, dark interior (behind the pup). -->
      <div class="doghouse doghouse-back" aria-hidden="true">
        <svg viewBox="0 0 226 150" width="226" height="150" xmlns="http://www.w3.org/2000/svg">
          <rect x="34" y="132" width="158" height="15" rx="5" fill="#a86f3d"/>
          <rect x="32" y="66" width="17" height="76" rx="5" fill="#cf9560"/>
          <rect x="177" y="66" width="17" height="76" rx="5" fill="#bb8650"/>
          <path d="M49 74 H177 V136 a6 6 0 0 1 -6 6 H55 a6 6 0 0 1 -6 -6 Z" fill="#382519"/>
        </svg>
      </div>
      <!-- Front of the house: the roof (in front of the pup, so it overhangs). -->
      <div class="doghouse doghouse-roof" aria-hidden="true">
        <svg viewBox="0 0 226 150" width="226" height="150" xmlns="http://www.w3.org/2000/svg">
          <path d="M16 78 L113 22 L210 78 Z" fill="#a15f37"/>
          <path d="M16 78 L113 22 L210 78" fill="none" stroke="#854626" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
          <rect x="42" y="70" width="142" height="12" rx="5" fill="#8f4f2c"/>
          <rect x="95" y="58" width="36" height="13" rx="4" fill="#efe1c2"/>
          <circle cx="113" cy="47" r="4" fill="#efe1c2"/>
        </svg>
      </div>

      <div id="stale" class="stale" hidden>
        <span class="dot"></span> Connection lost
      </div>
    </div>

    <script src="/static/board.js"></script>
  </body>
</html>
