<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Store Dashboard — Locked</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐶</text></svg>"
    />
    <style>
      :root {
        --cream: #f6efe2;
        --card: #fffdf8;
        --ink: #3f3428;
        --muted: #8a7c68;
        --sage: #7f9b78;
        --sage-dk: #5f7a58;
        --line: #e7dcc7;
        --red: #c9603f;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: "Inter", system-ui, sans-serif;
        background:
          radial-gradient(1200px 700px at 20% -10%, #fbf6ec 0%, transparent 60%),
          radial-gradient(1000px 700px at 100% 110%, #eef3ea 0%, transparent 55%),
          var(--cream);
        color: var(--ink);
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-user-select: none;
        user-select: none;
      }
      .box {
        width: min(92vw, 420px);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 26px;
        padding: 40px 36px 34px;
        text-align: center;
        box-shadow: 0 30px 70px rgba(80, 60, 30, 0.16);
      }
      .paw { font-size: 46px; line-height: 1; }
      h1 {
        font-family: "Fraunces", Georgia, serif;
        font-weight: 600;
        font-size: 28px;
        margin: 14px 0 2px;
      }
      .sub { color: var(--muted); font-size: 15px; margin-bottom: 26px; }
      .pins {
        display: flex;
        gap: 12px;
        justify-content: center;
        margin-bottom: 8px;
      }
      .pip {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2px solid var(--line);
        background: transparent;
        transition: transform 0.12s ease, background 0.12s ease, border-color 0.12s ease;
      }
      .pip.on { background: var(--sage); border-color: var(--sage); transform: scale(1.08); }
      .msg { min-height: 22px; color: var(--red); font-weight: 600; font-size: 14px; margin: 10px 0 18px; }
      .pad {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
      }
      .key {
        font-family: "Fraunces", Georgia, serif;
        font-size: 26px;
        font-weight: 500;
        padding: 18px 0;
        border-radius: 16px;
        border: 1px solid var(--line);
        background: #fffefb;
        color: var(--ink);
        cursor: pointer;
        transition: transform 0.08s ease, background 0.15s ease;
      }
      .key:active { transform: translateY(2px); background: #f1ead9; }
      .key.wide { font-size: 18px; font-family: "Inter", sans-serif; font-weight: 600; color: var(--muted); }
      .key.ok { background: var(--sage); border-color: var(--sage); color: #fff; }
      .key.ok:active { background: var(--sage-dk); }
      .shake { animation: shake 0.4s; }
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20%, 60% { transform: translateX(-9px); }
        40%, 80% { transform: translateX(9px); }
      }
    </style>
  </head>
  <body>
    <form class="box" id="box" autocomplete="off">
      <div class="paw">🐾</div>
      <h1>Store Dashboard</h1>
      <div class="sub">Enter the store PIN to unlock this display.</div>
      <div class="pins" id="pips"></div>
      <div class="msg" id="msg"></div>
      <div class="pad" id="pad"></div>
    </form>

    <script>
      const MAXLEN = 8; // allow PINs up to 8 digits
      let pin = "";
      const pips = document.getElementById("pips");
      const msg = document.getElementById("msg");
      const box = document.getElementById("box");

      function renderPips() {
        const n = Math.max(4, pin.length);
        pips.innerHTML = "";
        for (let i = 0; i < n; i++) {
          const d = document.createElement("div");
          d.className = "pip" + (i < pin.length ? " on" : "");
          pips.appendChild(d);
        }
      }

      async function submit() {
        if (!pin) return;
        msg.textContent = "";
        try {
          const r = await fetch("/board/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ pin }),
          });
          if (r.ok) {
            window.location.replace("/board/");
            return;
          }
        } catch (e) {}
        msg.textContent = "Incorrect PIN — try again";
        box.classList.remove("shake");
        void box.offsetWidth;
        box.classList.add("shake");
        pin = "";
        renderPips();
      }

      function press(v) {
        if (v === "del") { pin = pin.slice(0, -1); renderPips(); return; }
        if (v === "ok") { submit(); return; }
        if (pin.length >= MAXLEN) return;
        pin += v;
        renderPips();
        if (pin.length >= 4) { /* keep entering or press Enter */ }
      }

      const keys = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "del", "0", "ok"];
      const pad = document.getElementById("pad");
      keys.forEach((k) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "key" + (k === "del" || k === "ok" ? " wide" : "") + (k === "ok" ? " ok" : "");
        b.textContent = k === "del" ? "⌫" : k === "ok" ? "Enter" : k;
        b.addEventListener("click", () => press(k));
        pad.appendChild(b);
      });

      // Physical keyboard support (USB keyboard, laptop, etc.).
      window.addEventListener("keydown", (e) => {
        if (e.key >= "0" && e.key <= "9") press(e.key);
        else if (e.key === "Backspace") { e.preventDefault(); press("del"); }
        else if (e.key === "Enter") { e.preventDefault(); press("ok"); }
      });

      renderPips();
    </script>
  </body>
</html>
