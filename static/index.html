<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sugar Sweet Georgia Puppies — Social Media Employee</title>
    <link rel="stylesheet" href="/static/style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐶</text></svg>"
    />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="paw">🐶</span>
        <div class="brand-text">
          <strong>Sugar Sweet Georgia Puppies</strong>
          <span class="sub">Your social media employee</span>
        </div>
      </div>
      <div class="top-actions">
        <span class="pill" id="mode-pill" title="Research mode">…</span>
        <button class="btn primary" id="run-research">
          <span class="ic">✨</span><span class="lbl">Get today's plan</span>
        </button>
      </div>
    </header>

    <main id="view"><div class="skeleton-wrap" id="boot"></div></main>

    <nav class="nav" id="nav">
      <button data-tab="today" class="active"><span>🐶</span>Today</button>
      <button data-tab="ideas"><span>💡</span>Ideas</button>
      <button data-tab="calendar"><span>📅</span>Plan</button>
      <button data-tab="results"><span>📊</span>Results</button>
      <button data-tab="more"><span>⋯</span>More</button>
    </nav>

    <!-- Slide-over drawer for an idea's full detail -->
    <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
    <aside class="drawer" id="drawer" hidden aria-modal="true" role="dialog">
      <div class="drawer-head">
        <button class="icon-btn" id="drawer-close" aria-label="Close">✕</button>
      </div>
      <div id="drawer-body"></div>
    </aside>

    <div class="toast" id="toast" hidden></div>

    <script src="/static/app.js"></script>
  </body>
</html>
