<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e9bad" />
    <title>Sugar Sweet Georgia Puppies — Social Media Employee</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐶</text></svg>"
    />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="paw">🐶</span>
        <div class="brand-text">
          <strong>Sugar Sweet Georgia Puppies</strong>
          <span class="sub">Social media employee</span>
        </div>
      </div>
      <div class="top-actions">
        <span class="pill" id="mode-pill" title="Research mode">…</span>
        <button class="btn primary" id="run-research">
          <span class="lbl">Get today's plan</span>
        </button>
      </div>
    </header>

    <nav class="nav" id="nav">
      <div class="nav-brand"><span class="nb-mark">🐶</span><span>Sugar Sweet</span></div>
      <button data-tab="today" class="active">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
        <span class="t">Today</span>
      </button>
      <button data-tab="week">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v3M16 3v3"/></svg>
        <span class="t">This Week</span>
      </button>
    </nav>

    <main id="view"><div class="skeleton-wrap" id="boot"></div></main>

    <!-- Slide-over drawer for an idea's full detail -->
    <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
    <aside class="drawer" id="drawer" hidden aria-modal="true" role="dialog">
      <div class="drawer-head">
        <button class="icon-btn" id="drawer-close" aria-label="Close">✕</button>
      </div>
      <div id="drawer-body"></div>
    </aside>

    <div class="toast" id="toast" hidden></div>

    <script src="/static/app.js"></script>
  </body>
</html>
