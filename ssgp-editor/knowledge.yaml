#  mishearing breed names (e.g. "dachshund" -> "docks", "maltipoo" ->
#  "multi poo", "frenchton" -> "french ton").
#    1) breeds/terms -> handed to the transcriber up front so it EXPECTS these
#                       words (context: it's a puppy store).
#    2) corrections  -> exact auto-replacements for known mishears.
#  Breeds pulled from georgiapuppiesfromheaven.com. Add your own anytime —
#  just edit this file and re-render. No code changes.
# ============================================================================

