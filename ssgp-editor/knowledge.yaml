# ============================================================================
#  SSGP Editor — Knowledge base
#  Teaches the caption transcriber your store's vocabulary so it stops
#  mishearing breed names (e.g. "dachshund" as "docks", "maltipoo" as
#  "multi poo"). Two parts:
#    1) breeds/terms  -> fed to the transcriber up front so it EXPECTS these
#                        words (context: it's a puppy store).
#    2) corrections   -> exact auto-replacements for known mishears.
#  Add your own anytime — just edit this file and re-render. No code changes.
# ============================================================================

# The store + place, so it spells these right too.
terms:
  - Sugar Sweet Georgia Puppies
  - Lawrenceville, Georgia
  - teacup
  - micro
  - AKC registered
  - hypoallergenic

# Breeds you carry. The transcriber is told these are likely, so if a
# dachshund is in the video it hears "dachshund", not "docks".
