# ============================================================================
#  SSGP Editor — configuration
#  Every editing setting lives here. Change these and re-render; no code edits.
#  These are the DEFAULTS. Any value can be overridden per-job by the API
#  ("options" in POST /render) or by the sliders/toggles in the web UI.
# ============================================================================

# ---------------------------------------------------------------------------
# Output video format. These match what Instagram / TikTok / YouTube Shorts
# want for a vertical Reel, and they also re-encode iPhone HEVC into H.264.
# ---------------------------------------------------------------------------
output:
  width: 1080          # px  — canvas width (Short=1080/9:16, Long=1920/16:9; set by format)
  height: 1920         # px  — canvas height
  fps: 30              # frames per second
  # How footage is fitted to the canvas when its shape differs:
  #   cover_center — scale to fill, center-crop (best for 9:16 short-form)
  #   cover_at     — fill + crop toward crop_x/crop_y focus point
  #   fit_pad      — letterbox (no pixels lost, adds bars)
  #   blur_fill    — fit in front of a blurred filled copy (best for 16:9 long-form)
  reframe: cover_center
  crop_x: 0.5          # focus point for cover_at (0=left, 1=right)
  crop_y: 0.5          # focus point for cover_at (0=top, 1=bottom)
  color_fix: false     # OFF = keep the clip's original colour (no filter). ON = tone-map HDR
                       # footage to SDR. Only turn on if the video looks washed-out/grey.
  video_codec: libx264 # H.264
  pixel_format: yuv420p # max compatibility (fixes iPhone HEVC issue)
  crf: 20              # quality: lower = better/bigger (18-23 is a good range)
  preset: medium       # x264 speed/size tradeoff (ultrafast..veryslow)
  audio_bitrate: 192k
  faststart: true      # move moov atom to front so it streams/plays instantly
  max_duration: null   # TARGET length in seconds. The clip is COMPRESSED to fit into this
                       # (dead air trimmed + gently sped up) — it is NOT chopped off at N
                       # seconds, so nothing he says is lost. null = keep the natural length.
  max_speed: 1.35      # the most the clip will be sped up to hit the target before we stop
                       # (beyond ~1.35x the voice starts to sound rushed). Content is never cut.

# ---------------------------------------------------------------------------
# 1) AUTO CUTS — remove dead air / long silences so the clip stays tight.
#    We detect silence, then collapse any gap longer than `min_gap` down to a
#    short natural pause. `keep_pad` is left on BOTH sides of every cut so we
#    never clip the start or end of a spoken word.
# ---------------------------------------------------------------------------
cuts:
  enabled: true
  silence_threshold_db: -30   # quieter than this counts as "silence" (dB). More negative = stricter (only very quiet counts as silence).
  min_gap: 0.6                # seconds — only silences LONGER than this get trimmed
  keep_pad: 0.15              # seconds of audio kept on each side of a cut (word-safety padding)
  min_segment: 0.20           # seconds — drop tiny leftover slivers shorter than this
  max_removed_per_gap: null   # optional cap (seconds) on how much a single gap may be shortened; null = no cap

  # --- AI smart-cut: removes SPOKEN mistakes (false starts, "I forgot the
  #     script", retakes, off-topic tangents) that silence-cutting can't catch.
  #     Needs an Anthropic API key. Off by default. ---
  smart_cut: null             # null = AUTO (the AI editor runs whenever an API key is
                              # available); true = force on; false = force off
  anthropic_api_key: null     # or set the ANTHROPIC_API_KEY environment variable instead
  smart_cut_model: claude-sonnet-5
  smart_cut_instructions: null  # null = sensible default; or describe what to cut in plain English

  # --- Dog-only cut: keep ONLY the parts of the video where a dog/puppy is
  #     actually on screen, cut the rest. Uses on-device object detection.
  #     Needs a one-time install:  pip install ultralytics
  #     Off by default (it's slower + a bigger dependency). ---
  dog_cut: false
  dog_cut_sample_fps: 2       # how many frames per second to check for a dog
  dog_cut_confidence: 0.35    # detection confidence threshold
  dog_cut_pad: 0.4            # seconds kept on each side of a dog moment
  dog_cut_min_gap: 0.6        # only cut no-dog stretches longer than this

# ---------------------------------------------------------------------------
# 2) AUTO CAPTIONS — transcribe locally with faster-whisper, then burn in
#    animated word-by-word captions. No API key, runs on your machine.
# ---------------------------------------------------------------------------
captions:
  enabled: true

  # --- transcription (faster-whisper) ---
  model: small                # tiny | base | small | medium | large-v3  (bigger = more accurate words + timing, a bit slower)
  language: null              # e.g. "en" to force English; null = auto-detect
  compute_type: int8          # int8 (fast, CPU) | int8_float16 | float16 (GPU) | float32
  device: auto                # auto | cpu | cuda
  beam_size: 5

  # --- look & feel (matches the SSGP brand) ---
  font: Montserrat            # font family name
  font_weight: 800            # 800 = ExtraBold (maps to fonts/Montserrat-ExtraBold.ttf)
  font_size: 78               # px at 1080-wide frame
  fill_color: "#ffffff"       # white text
  stroke_color: "#1a1a1a"     # dark outline
  stroke_width: 6             # px outline thickness
  shadow: 2                   # px drop shadow (0 = off)

  # active-word highlight effect (the word being spoken pops)
  highlight_color: "#ffd24a"  # colour of the active word; set equal to fill_color for a white-only pop
  highlight_scale: 1.14       # active word is scaled up this much (1.0 = no size change)

  # layout
  position_pct: 0.74          # vertical position of the caption baseline (0=top, 1=bottom). 0.74 = lower third.
  width_pct: 0.84             # captions use ~84% of frame width
  max_chars_per_line: 20      # wrap a caption line at ~20 characters (fewer words on screen = tighter sync feel)
  uppercase: false            # set true for ALL-CAPS captions
  line_pause: 0.5             # seconds of silence that forces a new caption line
  time_offset: 0.0            # nudge all captions earlier(-) or later(+) in seconds, if they feel a touch ahead/behind

# ---------------------------------------------------------------------------
# 2b) SMART GRAPHICS — the "real editing" layer. An opening HOOK title card
#     plus animated KEYWORD POP-UPS timed to the speech (breed names, prices,
#     "first / second / third", "hypoallergenic", …). Drawn by Pillow like the
#     captions, so it works on any FFmpeg and never drifts out of sync.
# ---------------------------------------------------------------------------
graphics:
  enabled: true
  hook: true                 # show an opening headline card
  headline: null             # force a specific headline; null = auto ("3 things", or AI)
  hook_seconds: 2.2          # how long the hook card stays up
  use_ai: true               # let Claude write a snappier hook when an API key is set
  pops: true                 # animated word call-outs during the clip
  max_pops: 7                # at most this many pops in one clip
  min_spacing: 2.0           # seconds between pops (keeps it from getting busy)
  pop_hold: 1.1              # seconds each pop stays up
  pop_uppercase: true        # POP words in caps for punch
  # look
  hook_size: 92
  hook_color: "#ffffff"
  hook_band: "#12263a"       # translucent band behind the headline (brand navy)
  hook_band_opacity: 0.72
  hook_pos_pct: 0.16         # headline vertical position (0=top .. 1=bottom)
  hook_stroke: 5
  pop_size: 104
  pop_color: "#ffd23f"       # brand yellow
  pop_stroke: "#12263a"      # dark outline
  pop_stroke_w: 8
  pop_pos_pct: 0.42          # pop vertical position (upper-middle, above captions)
  badge_size: 150            # diameter of the number badge for "first/second/third"

# ---------------------------------------------------------------------------
# 3) AUTO ZOOM / PUNCH-IN — subtle motion so the clip never feels static.
#    A slow Ken Burns push-in across the whole clip, plus a gentle quick
#    punch on each cut. Keep it tasteful — default is deliberately subtle.
# ---------------------------------------------------------------------------
zoom:
  enabled: true
  intensity: 0.05     # total Ken Burns push over the clip (0.05 = zoom to +5%). Try 0.03 (barely) .. 0.12 (strong).
  punch_on_cuts: false # quick zoom bump at each cut. OFF by default — on a talking-head it reads as jittery/"warping". Turn on for fast montage-style edits.
  punch_amount: 0.04  # how hard the punch hits (added zoom) when punch_on_cuts is true
  punch_decay: 0.45   # seconds for a punch to ease back out
  punch_min_gap: 0.8  # only punch at cuts where at least this many seconds were removed (avoids punching every tiny pause)

# ---------------------------------------------------------------------------
# 4) BACKGROUND MUSIC — mix a bed from the /music folder, ducked under Phil's
#    voice so speech stays clearly audible.
# ---------------------------------------------------------------------------
music:
  enabled: true
  folder: music              # where your .mp3/.m4a/.wav beds live
  track: null                # exact filename to use, e.g. "bed1.mp3"; null = pick per `selection`
  selection: random          # random | first | alphabetical  (used when track is null)
  volume: 0.18               # base music level (0..1) BEFORE ducking. 0.18 ≈ background level.
  replace_voice: false       # true = remove the person's voice and play ONLY music over the video
                             #        (captions are still generated from what was said)
  solo_volume: 0.85          # music level when it's the only audio (replace_voice or silent source)
  duck_under_speech_db: -18  # how far below the voice the music sits while Phil talks
                             # (drives the sidechain ducking strength; -18 subtle, -22 strong)
  duck_attack: 5             # ms — how fast music drops when speech starts
  duck_release: 300          # ms — how fast music comes back when speech stops
  # --- voice cleanup (applied to the spoken track before mixing) ---
  voice_highpass: true       # roll off low rumble / handling noise below ~90Hz
  voice_denoise: false       # background-noise reduction (afftdn); cleaner, but can sound processed
  voice_lufs: -16            # normalise voice loudness to this LUFS (online-video standard, w/ headroom)
  fade_in: 0.5               # seconds
  fade_out: 0.8              # seconds

# ---------------------------------------------------------------------------
# 5) WATERMARK — persistent small text near the top.
# ---------------------------------------------------------------------------
watermark:
  enabled: true
  # Drop your logo at assets/logo.png (transparent PNG is best; a white
  # background is removed automatically). When present, a faint logo is placed
  # in a corner. If the file is missing, the text below is used instead.
  logo: assets/logo.png
  logo_opacity: 0.35         # super see-through
  logo_width_pct: 0.26       # logo width as a fraction of frame width
  position: bottom-right     # bottom-right | bottom-left | top-right | top-left
  margin_pct: 0.03           # gap from the edge
  remove_white_bg: true      # auto-make a white background transparent
  # text fallback (only used if assets/logo.png is missing):
  text: "Sugar Sweet Georgia Puppies · Lawrenceville, GA"
  font_weight: 700
  font_size: 34
  fill_color: "#ffffff"
  stroke_color: "#1a1a1a"
  stroke_width: 2
  opacity: 0.88
  position_y_pct: 0.045

# ---------------------------------------------------------------------------
# 6) CTA END CARD — optional 1.5–2s outro. OFF by default so a render never
#    breaks if the text isn't set.
# ---------------------------------------------------------------------------
cta:
  enabled: false
  duration: 2.2              # seconds
  background: "#ffffff"      # white — so the full colour logo (incl. navy text) shows
  logo: assets/logo.png      # shown at the top of the card (auto white-removal)
  logo_width_pct: 0.66
  remove_white_bg: true
  # The focus: name, number, location
  business: "Sugar Sweet Georgia Puppies"
  location: "Lawrenceville, GA"
  phone: "(678) 253-4081"
  cta_line: "Come meet your new best friend"   # small line above the name (optional)
  # colours (tuned for a white card)
  title_color: "#12263a"     # business name (navy)
  muted_color: "#5b6b7a"     # tagline + location (slate)
  accent_color: "#ffd23f"    # phone pill background (brand yellow)
  phone_text_color: "#12263a" # phone text on the yellow pill
  font_weight: 800
  # sizes (auto-shrink to fit width)
  tagline_size: 50
  name_size: 68
  location_size: 46
  phone_size: 82

# ---------------------------------------------------------------------------
# Folders + server. Sources are downloaded to `work` and cleaned up after;
# finished renders land in `output` and are served at /files/{id}.mp4
# ---------------------------------------------------------------------------
paths:
  work_dir: work
  output_dir: output
  fonts_dir: fonts

server:
  host: 0.0.0.0
  port: 8080
  cleanup_work: true         # delete the per-job work folder after a successful render
  keep_failed_work: true     # keep work files when a render fails (for debugging)
  max_upload_mb: 2048        # reject direct uploads larger than this
