# Render deploy config for social-media-divp.
# This one service now serves BOTH:
#   /       -> the Sugar Sweet social-media app (Phil's filming hub: Today / This Week)
#   /board  -> the store wall-display Board (PIN-protected)
# Secrets (GoHighLevel token, board PIN, Anthropic key) are NOT in here — set them
# in the Render dashboard (Environment tab) so they stay out of git.
services:
  - type: web
    name: ssgp-board
    runtime: python
    plan: free # bump to "starter" ($7/mo) if you want it always-on overnight
    branch: claude/lead-floor-board-display-auglt0
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false # set in the Render dashboard — enables live research for the social app
      - key: DAILY_RUN_ENABLED
        value: "true" # run the daily social-media research/briefing so "Today" is ready each morning
      - key: DAILY_RUN_TIME
        value: "07:00"
      - key: TIMEZONE
        value: America/New_York
      - key: BOARD_GHL_LOCATION_ID
        value: "7OAoy2QT49JimX9IsVnf"
      - key: BOARD_GHL_CALENDAR_ID
        value: "g8MCjvLjpPvyvu4k3WGG"
      - key: BOARD_GHL_TOKEN
        sync: false # set this in the Render dashboard (secret)
      - key: BOARD_PIN
        sync: false # access PIN for the wall display; set in Render dashboard
